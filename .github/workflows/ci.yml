name: Required CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: required-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: required / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          package-manager-cache: false
      - name: Provision Codex sandbox test group
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-LocalGroup -Name CodexSandboxUsers -ErrorAction SilentlyContinue)) {
            New-LocalGroup -Name CodexSandboxUsers `
              -Description "ACL integration test group"
          }
      - name: Run regression suite
        run: npm test
      - name: Validate project template
        run: npm run validate:self
